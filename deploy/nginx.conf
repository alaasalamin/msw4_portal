server {
    server_name bizo.technology;
    root /var/www/msw/public;
    index index.php index.html;

    client_max_body_size 20M;

    # Proxy Reverb WebSocket through port 443 so no extra firewall port needed
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;

        # Inertia + Filament responses can ship sizeable headers (cookies,
        # X-Inertia-* meta, propagated session data). Defaults of 4k overflow
        # easily and nginx returns 502 with "upstream sent too big header".
        # Some Site Pages with rich theme_sections push past 32k as well.
        fastcgi_buffer_size 128k;
        fastcgi_buffers 32 32k;
        fastcgi_busy_buffers_size 256k;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/bizo.technology/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bizo.technology/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = bizo.technology) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name bizo.technology;
    return 404;
}
